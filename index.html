<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedCore</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#05070c;
  --card:#0c111b;
  --line:#1c2635;
  --cyan:#28e6ff;
  --purple:#8b5cf6;
  --green:#00e68a;
  --text:#f5f7fa;
  --muted:#718096;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%, rgba(40,230,255,.12), transparent 28%),
    radial-gradient(circle at 80% 90%, rgba(139,92,246,.12), transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:Arial, sans-serif;
}

.app{
  width:min(1100px,94%);
  margin:auto;
  padding:28px 0 50px;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:20px;
  border-bottom:1px solid var(--line);
}

.logo{
  font-weight:900;
  font-size:20px;
  letter-spacing:1px;
}

.logo span{
  color:var(--cyan);
}

.status{
  color:var(--green);
  font-size:12px;
}

.hero{
  text-align:center;
  padding:60px 0 35px;
}

.hero h1{
  font-size:clamp(44px,8vw,84px);
  letter-spacing:-4px;
}

.hero h1 span{
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:var(--muted);
  margin-top:14px;
}

.dashboard{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:18px;
}

.panel{
  background:rgba(12,17,27,.85);
  border:1px solid var(--line);
  border-radius:26px;
  padding:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.speed-panel{
  min-height:460px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.gauge{
  width:300px;
  height:300px;
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
  background:
    conic-gradient(
      var(--cyan) 0deg,
      rgba(255,255,255,.06) 0deg
    );
  transition:.3s;
}

.gauge::before{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  border-radius:50%;
  background:#080d15;
  border:1px solid #182334;
}

.gauge-data{
  position:relative;
  z-index:2;
  text-align:center;
}

.speed{
  font-size:76px;
  font-weight:900;
  letter-spacing:-4px;
}

.unit{
  color:var(--muted);
  margin-top:5px;
}

.phase{
  color:var(--cyan);
  margin-top:22px;
  font-size:13px;
  letter-spacing:2px;
}

.start{
  margin-top:26px;
  width:220px;
  padding:16px;
  border:0;
  border-radius:16px;
  cursor:pointer;
  color:#001014;
  font-weight:900;
  background:linear-gradient(90deg,var(--cyan),#6fffc4);
  transition:.2s;
}

.start:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 35px rgba(40,230,255,.2);
}

.start:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.metrics{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.metric{
  padding:20px;
  border-radius:18px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.06);
}

.label{
  color:var(--muted);
  font-size:12px;
  letter-spacing:1px;
}

.value{
  font-size:32px;
  font-weight:900;
  margin-top:7px;
}

.value small{
  font-size:14px;
  color:var(--muted);
}

.progress-wrap{
  margin-top:16px;
}

.progress{
  height:7px;
  border-radius:10px;
  background:#111a27;
  overflow:hidden;
}

.progress-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  transition:.2s;
}

.info{
  grid-column:1/-1;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.info-box{
  background:rgba(12,17,27,.8);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
}

.info-box span{
  color:var(--muted);
  font-size:12px;
}

.info-box b{
  display:block;
  margin-top:7px;
}

.error{
  color:#ff6b7d;
  margin-top:14px;
  min-height:20px;
  font-size:13px;
}

@media(max-width:780px){
  .dashboard{
    grid-template-columns:1fr;
  }

  .info{
    grid-template-columns:1fr;
  }

  .gauge{
    width:230px;
    height:230px;
  }

  .gauge::before{
    width:190px;
    height:190px;
  }

  .speed{
    font-size:58px;
  }
}
</style>
</head>

<body>

<div class="app">

<nav>
  <div class="logo">
    SPEED<span>CORE</span>
  </div>

  <div class="status">
    ● READY
  </div>
</nav>

<section class="hero">
  <h1>Internet <span>Speed Test</span></h1>
  <p>Testează ping-ul, download-ul și upload-ul conexiunii tale.</p>
</section>

<div class="dashboard">

  <div class="panel speed-panel">

    <div class="gauge" id="gauge">
      <div class="gauge-data">
        <div class="speed" id="speed">0</div>
        <div class="unit" id="unit">Mbps</div>
      </div>
    </div>

    <div class="phase" id="phase">
      READY
    </div>

    <button class="start" id="startBtn" onclick="runTest()">
      START TEST
    </button>

    <div class="error" id="error"></div>

  </div>

  <div class="panel">

    <div class="metrics">

      <div class="metric">
        <div class="label">PING</div>
        <div class="value">
          <span id="ping">--</span>
          <small>ms</small>
        </div>
      </div>

      <div class="metric">
        <div class="label">DOWNLOAD</div>
        <div class="value">
          <span id="download">--</span>
          <small>Mbps</small>
        </div>
      </div>

      <div class="metric">
        <div class="label">UPLOAD</div>
        <div class="value">
          <span id="upload">--</span>
          <small>Mbps</small>
        </div>
      </div>

      <div class="metric">
        <div class="label">PROGRESS</div>

        <div class="progress-wrap">
          <div class="progress">
            <div class="progress-fill" id="progress"></div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <div class="info">

    <div class="info-box">
      <span>SERVER</span>
      <b>Cloudflare Network</b>
    </div>

    <div class="info-box">
      <span>TEST MODE</span>
      <b>Browser HTTP</b>
    </div>

    <div class="info-box">
      <span>STATUS</span>
      <b id="statusText">Waiting</b>
    </div>

  </div>

</div>

</div>

<script>

const CF = "https://speed.cloudflare.com";

const speedEl = document.getElementById("speed");
const phaseEl = document.getElementById("phase");
const gauge = document.getElementById("gauge");
const progress = document.getElementById("progress");
const errorEl = document.getElementById("error");
const startBtn = document.getElementById("startBtn");
const statusText = document.getElementById("statusText");

function setPhase(text, percent){
  phaseEl.textContent = text;
  progress.style.width = percent + "%";
  statusText.textContent = text;
}

function updateGauge(value, max = 500){

  let safe = Math.min(value, max);
  let deg = (safe / max) * 360;

  gauge.style.background =
    `conic-gradient(
      #28e6ff 0deg,
      #8b5cf6 ${deg}deg,
      rgba(255,255,255,.06) ${deg}deg
    )`;

  speedEl.textContent =
    value < 10
      ? value.toFixed(1)
      : Math.round(value);
}

async function testPing(){

  setPhase("TESTING PING", 15);

  let results = [];

  for(let i = 0; i < 5; i++){

    const start = performance.now();

    await fetch(
      `${CF}/__down?bytes=0&r=${Math.random()}`,
      {
        cache:"no-store"
      }
    );

    const end = performance.now();

    results.push(end - start);

  }

  results.sort((a,b)=>a-b);

  return results[Math.floor(results.length/2)];
}

async function testDownload(){

  setPhase("TESTING DOWNLOAD", 35);

  /*
    25 MB.
    Poți pune:
    10000000 = 10 MB
    25000000 = 25 MB
    50000000 = 50 MB
  */

  const bytes = 25000000;

  const start = performance.now();

  const response = await fetch(
    `${CF}/__down?bytes=${bytes}&r=${Math.random()}`,
    {
      cache:"no-store"
    }
  );

  if(!response.ok){
    throw new Error("Download test failed");
  }

  const reader = response.body.getReader();

  let received = 0;

  while(true){

    const {done,value} = await reader.read();

    if(done) break;

    received += value.length;

    const elapsed =
      (performance.now() - start) / 1000;

    const mbps =
      (received * 8) /
      elapsed /
      1_000_000;

    updateGauge(mbps,500);

  }

  const seconds =
    (performance.now() - start) / 1000;

  return (
    received * 8 /
    seconds /
    1_000_000
  );
}

async function testUpload(){

  setPhase("TESTING UPLOAD", 70);

  const size = 8_000_000;

  const data =
    new Uint8Array(size);

  crypto.getRandomValues(
    data.subarray(0,65536)
  );

  /*
    Restul poate rămâne zero.
    Pentru speed test contează cantitatea de bytes transmisă.
  */

  const start = performance.now();

  const response = await fetch(
    `${CF}/__up`,
    {
      method:"POST",
      body:data,
      cache:"no-store"
    }
  );

  if(!response.ok){
    throw new Error("Upload test failed");
  }

  const seconds =
    (performance.now() - start) / 1000;

  const mbps =
    (size * 8) /
    seconds /
    1_000_000;

  updateGauge(mbps,500);

  return mbps;
}

async function runTest(){

  errorEl.textContent = "";

  startBtn.disabled = true;

  document.getElementById("ping").textContent = "--";
  document.getElementById("download").textContent = "--";
  document.getElementById("upload").textContent = "--";

  updateGauge(0);

  try{

    /*
      PING
    */

    const ping = await testPing();

    document.getElementById("ping").textContent =
      Math.round(ping);

    /*
      DOWNLOAD
    */

    setPhase("TESTING DOWNLOAD", 40);

    const download =
      await testDownload();

    document.getElementById("download").textContent =
      download.toFixed(1);

    /*
      UPLOAD
    */

    setPhase("TESTING UPLOAD", 75);

    const upload =
      await testUpload();

    document.getElementById("upload").textContent =
      upload.toFixed(1);

    /*
      COMPLETE
    */

    setPhase("TEST COMPLETE", 100);

    updateGauge(download,500);

    statusText.textContent = "Completed";

  }

  catch(err){

    console.error(err);

    errorEl.textContent =
      "Testul nu a putut fi finalizat. Încearcă din nou.";

    setPhase("ERROR",0);

  }

  finally{

    startBtn.disabled = false;
    startBtn.textContent = "TEST AGAIN";

  }

}

</script>

</body>
</html>
