<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Scan</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #070b16;
      --card: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.12);
      --text: #ffffff;
      --muted: #9ca3af;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --cyan: #22d3ee;
      --green: #34d399;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(139,92,246,.25), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34,211,238,.18), transparent 30%),
        var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .4;
      animation: float 7s ease-in-out infinite alternate;
    }

    .orb.one {
      width: 260px;
      height: 260px;
      background: #7c3aed;
      top: 8%;
      left: 8%;
    }

    .orb.two {
      width: 220px;
      height: 220px;
      background: #0891b2;
      bottom: 8%;
      right: 8%;
      animation-delay: 1.5s;
    }

    @keyframes float {
      from { transform: translateY(-20px) translateX(0); }
      to { transform: translateY(30px) translateX(25px); }
    }

    .app {
      width: min(94%, 760px);
      padding: 26px;
      border-radius: 30px;
      background: rgba(11, 17, 32, .72);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
      position: relative;
      z-index: 2;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    .logo-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      box-shadow: 0 8px 30px rgba(139,92,246,.35);
    }

    .status {
      font-size: 13px;
      color: var(--green);
      padding: 8px 12px;
      border: 1px solid rgba(52,211,153,.25);
      background: rgba(52,211,153,.08);
      border-radius: 999px;
    }

    .hero {
      text-align: center;
      padding: 18px 8px 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #d8b4fe;
      background: rgba(139,92,246,.12);
      border: 1px solid rgba(139,92,246,.25);
      font-size: 13px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 74px);
      line-height: .96;
      letter-spacing: -3px;
      margin-bottom: 18px;
    }

    .gradient-text {
      background: linear-gradient(90deg, #fff, #c4b5fd, #67e8f9);
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 16px;
      max-width: 560px;
      margin: 0 auto 28px;
      line-height: 1.6;
    }

    .input-wrap {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 18px;
    }

    input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16px;
      padding: 14px;
    }

    input::placeholder {
      color: #6b7280;
    }

    .main-btn {
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      min-height: 52px;
      color: white;
      cursor: pointer;
      font-weight: 800;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 12px 30px rgba(236,72,153,.22);
      transition: .2s;
    }

    .main-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    #result {
      display: none;
      margin-top: 26px;
      animation: show .45s ease;
    }

    @keyframes show {
      from {
        opacity: 0;
        transform: translateY(16px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
    }

    .score-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 270px;
    }

    .score-ring {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      background:
        conic-gradient(
          var(--cyan) 0deg,
          var(--purple) 180deg,
          rgba(255,255,255,.08) 180deg
        );
    }

    .score-ring::before {
      content: "";
      width: 150px;
      height: 150px;
      position: absolute;
      border-radius: 50%;
      background: #0d1323;
    }

    .score-inside {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .score {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .out-of {
      color: var(--muted);
      font-size: 13px;
    }

    .name-result {
      margin-top: 18px;
      color: #c4b5fd;
      font-weight: 700;
    }

    .stats {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stat {
      padding: 15px;
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.06);
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    .stat-name {
      font-size: 14px;
    }

    .stat-value {
      font-weight: 800;
    }

    .bar {
      height: 7px;
      background: rgba(255,255,255,.07);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      transition: width .8s ease;
    }

    .prediction {
      margin-top: 16px;
      padding: 20px;
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(139,92,246,.12), rgba(34,211,238,.06));
      border: 1px solid rgba(139,92,246,.2);
      font-size: 17px;
      line-height: 1.5;
    }

    .again {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(255,255,255,.05);
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .again:hover {
      background: rgba(255,255,255,.09);
    }

    .footer {
      text-align: center;
      color: #4b5563;
      font-size: 12px;
      margin-top: 22px;
    }

    .confetti {
      position: fixed;
      top: -30px;
      width: 9px;
      height: 16px;
      border-radius: 3px;
      z-index: 10;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform: translateY(110vh) rotate(900deg);
        opacity: .9;
      }
    }

    @media (max-width: 650px) {
      .app {
        padding: 18px;
        border-radius: 24px;
      }

      .topbar {
        margin-bottom: 10px;
      }

      .result-grid {
        grid-template-columns: 1fr;
      }

      .input-wrap {
        flex-direction: column;
      }

      .main-btn {
        width: 100%;
      }

      h1 {
        letter-spacing: -2px;
      }
    }
  </style>
</head>

<body>

  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="app">

    <div class="topbar">
      <div class="logo">
        <div class="logo-badge">✦</div>
        LuckyScan
      </div>

      <div class="status">
        ● LIVE
      </div>
    </div>

    <section class="hero" id="start">

      <div class="pill">
        ✨ AI Luck Scanner 2026
      </div>

      <h1>
        <span class="gradient-text">Scanează-ți norocul.</span>
      </h1>

      <p class="subtitle">
        Introdu numele și vezi ce scor de noroc îți rezervă ziua de azi.
        Rezultatele sunt generate pentru distracție.
      </p>

      <div class="input-wrap">
        <input
          type="text"
          id="name"
          placeholder="Ex: Alex"
          maxlength="24"
        />

        <button
          class="main-btn"
          onclick="scanLuck()"
        >
          SCANEAZĂ ⚡
        </button>
      </div>

    </section>

    <section id="result">

      <div class="result-grid">

        <div class="panel score-panel">

          <div class="score-ring" id="scoreRing">
            <div class="score-inside">
              <div class="score" id="score">0</div>
              <div class="out-of">din 100</div>
            </div>
          </div>

          <div class="name-result" id="resultName"></div>

        </div>

        <div class="panel">

          <div class="stats">

            <div class="stat">
              <div class="stat-top">
                <span class="stat-name">💸 Bani</span>
                <span class="stat-value" id="moneyValue"></span>
              </div>
              <div class="bar">
                <div class="bar-fill" id="moneyBar"></div>
              </div>
            </div>

            <div class="stat">
              <div class="stat-top">
                <span class="stat-name">❤️ Dragoste</span>
                <span class="stat-value" id="loveValue"></span>
              </div>
              <div class="bar">
                <div class="bar-fill" id="loveBar"></div>
              </div>
            </div>

            <div class="stat">
              <div class="stat-top">
                <span class="stat-name">🎮 Gaming</span>
                <span class="stat-value" id="gameValue"></span>
              </div>
              <div class="bar">
                <div class="bar-fill" id="gameBar"></div>
              </div>
            </div>

            <div class="stat">
              <div class="stat-top">
                <span class="stat-name">📱 Social</span>
                <span class="stat-value" id="socialValue"></span>
              </div>
              <div class="bar">
                <div class="bar-fill" id="socialBar"></div>
              </div>
            </div>

          </div>

        </div>

      </div>

      <div class="prediction" id="prediction"></div>

      <button class="again" onclick="resetScan()">
        ↻ Scanează din nou
      </button>

    </section>

    <div class="footer">
      LuckyScan • făcut doar pentru distracție
    </div>

  </main>

  <script>

    const predictions = [
      "Azi ai energie de personaj principal. 😎",
      "E posibil să primești un mesaj exact când nu te aștepți. 📱",
      "Norocul tău este suspect de bun azi. 🍀",
      "Ceva ce părea blocat ar putea începe să funcționeze. ⚡",
      "Ai șanse mari să ai parte de o surpriză interesantă. 👀",
      "Universul îți spune să încerci ceva nou azi. ✨",
      "Azi e genul de zi în care o idee random poate deveni una foarte bună. 💡",
      "Nu ignora oportunitățile mici. Una dintre ele poate deveni importantă. 🚀",
      "Ziua ta are potențial de screenshot. 📸",
      "Ai grijă la colțurile de mobilă. Norocul nu te protejează de toate. 💀"
    ];

    function random(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function scanLuck() {

      const input = document.getElementById("name");

      const name =
        input.value.trim() || "Necunoscut";

      const score = random(25, 100);
      const money = random(10, 100);
      const love = random(10, 100);
      const game = random(10, 100);
      const social = random(10, 100);

      document.getElementById("start").style.display = "none";
      document.getElementById("result").style.display = "block";

      document.getElementById("resultName").textContent =
        name + ", acesta este scorul tău";

      animateScore(score);

      setStat("money", money);
      setStat("love", love);
      setStat("game", game);
      setStat("social", social);

      document.getElementById("prediction").textContent =
        predictions[random(0, predictions.length - 1)];

      const degrees = score * 3.6;

      document.getElementById("scoreRing").style.background =
        `conic-gradient(
          #22d3ee 0deg,
          #8b5cf6 ${degrees}deg,
          rgba(255,255,255,.08) ${degrees}deg
        )`;

      if (score >= 80) {
        confetti();
      }
    }

    function animateScore(target) {

      const scoreEl = document.getElementById("score");

      let current = 0;

      const interval = setInterval(() => {

        current++;

        scoreEl.textContent = current;

        if (current >= target) {
          clearInterval(interval);
        }

      }, 15);
    }

    function setStat(type, value) {

      document.getElementById(type + "Value").textContent =
        value + "%";

      setTimeout(() => {
        document.getElementById(type + "Bar").style.width =
          value + "%";
      }, 100);
    }

    function resetScan() {

      document.getElementById("result").style.display = "none";
      document.getElementById("start").style.display = "block";

      document.querySelectorAll(".bar-fill").forEach(bar => {
        bar.style.width = "0";
      });
    }

    function confetti() {

      const colors = [
        "#8b5cf6",
        "#22d3ee",
        "#ec4899",
        "#34d399",
        "#facc15"
      ];

      for (let i = 0; i < 80; i++) {

        const piece =
          document.createElement("div");

        piece.className = "confetti";

        piece.style.left =
          Math.random() * 100 + "vw";

        piece.style.background =
          colors[random(0, colors.length - 1)];

        piece.style.animationDuration =
          2 + Math.random() * 3 + "s";

        piece.style.animationDelay =
          Math.random() * .5 + "s";

        document.body.appendChild(piece);

        setTimeout(() => {
          piece.remove();
        }, 5500);

      }
    }

    document
      .getElementById("name")
      .addEventListener("keydown", function(e) {

        if (e.key === "Enter") {
          scanLuck();
        }

      });

  </script>

</body>
</html>
