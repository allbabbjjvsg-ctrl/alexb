<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Fun</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial,sans-serif;
      background:
        radial-gradient(circle at top,#342060,#090b13 55%);
      color:white;
      padding:20px;
    }

    .app{
      width:min(95%,520px);
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12);
      border-radius:28px;
      padding:24px;
      backdrop-filter:blur(20px);
      box-shadow:0 30px 80px rgba(0,0,0,.45);
    }

    h1{
      font-size:34px;
      margin-bottom:8px;
    }

    .description{
      color:#aab0c2;
      line-height:1.5;
      margin-bottom:20px;
    }

    .camera{
      position:relative;
      width:100%;
      aspect-ratio:3/4;
      overflow:hidden;
      border-radius:22px;
      background:#030407;
      border:1px solid rgba(255,255,255,.1);
    }

    video,
    #photo{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    #photo{
      display:none;
    }

    .camera-label{
      position:absolute;
      left:14px;
      top:14px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(10px);
      font-size:12px;
    }

    .controls{
      display:grid;
      gap:12px;
      margin-top:18px;
    }

    button{
      width:100%;
      border:0;
      border-radius:16px;
      padding:16px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }

    #cameraBtn{
      background:white;
      color:#111;
    }

    #captureBtn{
      display:none;
      color:white;
      background:linear-gradient(90deg,#7c5cff,#d449ff);
    }

    #againBtn{
      display:none;
      background:rgba(255,255,255,.09);
      color:white;
      border:1px solid rgba(255,255,255,.12);
    }

    .status{
      min-height:22px;
      margin-top:15px;
      text-align:center;
      color:#b9c1d2;
      font-size:14px;
    }

    .success{
      color:#63f5aa;
    }

    .error{
      color:#ff7a91;
    }

    .notice{
      margin-top:15px;
      padding:13px;
      border-radius:14px;
      background:rgba(255,255,255,.04);
      color:#8993a7;
      font-size:12px;
      line-height:1.5;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>📸 Camera Fun</h1>

  <p class="description">
    Permite accesul la cameră, apoi apasă butonul pentru a face și salva fotografia.
  </p>

  <div class="camera">

    <video
      id="video"
      autoplay
      playsinline>
    </video>

    <img id="photo">

    <div class="camera-label">
      ● CAMERA
    </div>

  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <div class="controls">

    <button id="cameraBtn">
      Pornește camera
    </button>

    <button id="captureBtn">
      📸 Fă și salvează poza
    </button>

    <button id="againBtn">
      Fă altă poză
    </button>

  </div>

  <div class="status" id="status"></div>

  <div class="notice">
    Fotografia este făcută numai după ce apeși butonul și va fi încărcată în spațiul configurat de proprietarul site-ului.
  </div>

</div>

<script>

  /* ==========================
     CONFIG SUPABASE
  ========================== */

  const SUPABASE_URL =
    "https://SUPABASE-PROJECT.supabase.co";

  const SUPABASE_ANON_KEY =
    "SUPABASE_ANON_KEY";

  const BUCKET =
    "prank-photos";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* ==========================
     ELEMENTE
  ========================== */

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const photo =
    document.getElementById("photo");

  const cameraBtn =
    document.getElementById("cameraBtn");

  const captureBtn =
    document.getElementById("captureBtn");

  const againBtn =
    document.getElementById("againBtn");

  const status =
    document.getElementById("status");

  let stream = null;


  /* ==========================
     CAMERA
  ========================== */

  async function startCamera(){

    try{

      status.textContent =
        "Se cere accesul la cameră...";

      status.className =
        "status";

      stream =
        await navigator.mediaDevices.getUserMedia({
          video:{
            facingMode:"user"
          },
          audio:false
        });

      video.srcObject =
        stream;

      cameraBtn.style.display =
        "none";

      captureBtn.style.display =
        "block";

      status.textContent =
        "Camera este pornită.";

    }

    catch(error){

      console.error(error);

      status.textContent =
        "Nu am putut accesa camera.";

      status.className =
        "status error";

    }

  }


  /* ==========================
     CAPTURE
  ========================== */

  async function capturePhoto(){

    if(!stream){
      return;
    }

    captureBtn.disabled =
      true;

    status.textContent =
      "Se face fotografia...";

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;

    const ctx =
      canvas.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const blob =
      await new Promise(resolve => {

        canvas.toBlob(
          resolve,
          "image/jpeg",
          0.90
        );

      });

    if(!blob){

      status.textContent =
        "Eroare la fotografie.";

      captureBtn.disabled =
        false;

      return;
    }


    /* preview */

    const previewURL =
      URL.createObjectURL(blob);

    photo.src =
      previewURL;

    video.style.display =
      "none";

    photo.style.display =
      "block";


    /* ==========================
       UPLOAD SUPABASE
    ========================== */

    status.textContent =
      "Se salvează fotografia...";


    const randomName =
      crypto.randomUUID();

    const fileName =
      `photos/${Date.now()}-${randomName}.jpg`;


    const { data, error } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .upload(
          fileName,
          blob,
          {
            contentType:"image/jpeg",
            upsert:false
          }
        );


    if(error){

      console.error(error);

      status.textContent =
        "Eroare la salvare: " +
        error.message;

      status.className =
        "status error";

      captureBtn.disabled =
        false;

      return;
    }


    status.textContent =
      "✅ Fotografia a fost salvată.";

    status.className =
      "status success";


    captureBtn.style.display =
      "none";

    againBtn.style.display =
      "block";

  }


  /* ==========================
     RESET
  ========================== */

  function takeAnother(){

    photo.style.display =
      "none";

    video.style.display =
      "block";

    captureBtn.style.display =
      "block";

    captureBtn.disabled =
      false;

    againBtn.style.display =
      "none";

    status.textContent =
      "Poți face o altă fotografie.";

    status.className =
      "status";

  }


  cameraBtn.addEventListener(
    "click",
    startCamera
  );

  captureBtn.addEventListener(
    "click",
    capturePhoto
  );

  againBtn.addEventListener(
    "click",
    takeAnother
  );

</script>

</body>
</html>
