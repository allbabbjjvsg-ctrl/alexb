<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK TERMINAL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --green:#00ff66;
  --dark:#020402;
  --panel:#050805;
  --line:#113018;
  --red:#ff355d;
}

body{
  background:#020402;
  color:var(--green);
  font-family:Consolas, "Courier New", monospace;
  min-height:100vh;
  overflow:hidden;
}

canvas{
  position:fixed;
  inset:0;
  z-index:0;
  opacity:.18;
}

.overlay{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.02) 0px,
      rgba(255,255,255,.02) 1px,
      transparent 1px,
      transparent 4px
    );
  z-index:20;
}

.screen{
  position:relative;
  z-index:2;
  width:min(1100px,95%);
  height:92vh;
  margin:4vh auto;
  border:1px solid #155b2d;
  background:rgba(0,10,3,.92);
  box-shadow:
    0 0 20px rgba(0,255,102,.15),
    inset 0 0 70px rgba(0,255,102,.03);
}

.topbar{
  height:42px;
  border-bottom:1px solid #14431f;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  font-size:12px;
}

.brand{
  font-weight:bold;
  letter-spacing:2px;
}

.status{
  color:#8affaf;
}

.main{
  height:calc(100% - 42px);
  display:grid;
  grid-template-columns:1.5fr .7fr;
}

.terminal{
  padding:20px;
  border-right:1px solid #10391a;
  overflow:auto;
  font-size:14px;
  line-height:1.6;
}

.side{
  padding:18px;
}

.box{
  border:1px solid #12431f;
  padding:14px;
  margin-bottom:14px;
  background:rgba(0,255,100,.025);
}

.box-title{
  font-size:11px;
  color:#70aa7e;
  margin-bottom:10px;
  letter-spacing:2px;
}

.big{
  font-size:34px;
  font-weight:bold;
}

.green{
  color:var(--green);
}

.red{
  color:var(--red);
}

.bar{
  height:7px;
  background:#071109;
  margin-top:8px;
  overflow:hidden;
}

.fill{
  width:0;
  height:100%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
  transition:width .8s;
}

.line{
  white-space:pre-wrap;
}

.dim{
  color:#477452;
}

.warn{
  color:#e0ff79;
}

.error{
  color:#ff4169;
}

.inputline{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.inputline span{
  color:var(--green);
}

input{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  color:var(--green);
  font:inherit;
  caret-color:var(--green);
}

.cursor{
  width:8px;
  height:16px;
  background:var(--green);
  display:inline-block;
  animation:blink .8s infinite;
}

@keyframes blink{
  50%{opacity:0}
}

.glitch{
  animation:glitch .12s linear 5;
}

@keyframes glitch{
  0%{transform:translate(0)}
  20%{transform:translate(-3px,2px)}
  40%{transform:translate(4px,-2px)}
  60%{transform:translate(-2px,-1px)}
  80%{transform:translate(2px,2px)}
  100%{transform:translate(0)}
}

@media(max-width:800px){
  body{
    overflow:auto;
  }

  .screen{
    height:auto;
    min-height:95vh;
  }

  .main{
    grid-template-columns:1fr;
  }

  .terminal{
    border-right:0;
    border-bottom:1px solid #10391a;
    min-height:65vh;
  }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<div class="overlay"></div>

<div class="screen">

  <div class="topbar">
    <div class="brand">BLACKNODE // TERMINAL</div>
    <div class="status">SECURE CHANNEL ACTIVE ●</div>
  </div>

  <div class="main">

    <div class="terminal" id="terminal">

      <div class="line">BLACKNODE SYSTEM v7.31</div>
      <div class="line dim">Type <b>help</b> to list commands.</div>
      <br>

      <div id="history"></div>

      <div class="inputline">
        <span>root@blacknode:~$</span>
        <input id="cmd" autofocus autocomplete="off">
      </div>

    </div>

    <div class="side">

      <div class="box">
        <div class="box-title">SYSTEM STATUS</div>
        <div class="big">ONLINE</div>
      </div>

      <div class="box">
        <div class="box-title">CPU LOAD</div>
        <div id="cpuVal">12%</div>
        <div class="bar"><div class="fill" id="cpuBar"></div></div>
      </div>

      <div class="box">
        <div class="box-title">NETWORK ACTIVITY</div>
        <div id="netVal">0 MB/s</div>
        <div class="bar"><div class="fill" id="netBar"></div></div>
      </div>

      <div class="box">
        <div class="box-title">ACTIVE NODES</div>
        <div class="big" id="nodes">4</div>
      </div>

      <div class="box">
        <div class="box-title">ACCESS LEVEL</div>
        <div class="green">ROOT / LEVEL 7</div>
      </div>

    </div>

  </div>

</div>

<script>
const terminal = document.getElementById("terminal");
const history = document.getElementById("history");
const cmd = document.getElementById("cmd");

const fakeIPs = [
  "10.24.88.12",
  "172.19.4.77",
  "192.168.1.22",
  "10.77.13.9",
  "172.24.91.10"
];

function addLine(text, cls=""){
  const div = document.createElement("div");
  div.className = "line " + cls;
  div.textContent = text;
  history.appendChild(div);
  terminal.scrollTop = terminal.scrollHeight;
}

function wait(ms){
  return new Promise(r => setTimeout(r, ms));
}

async function fakeScan(){
  addLine("[+] Initializing network scan...");
  await wait(350);

  for(let i=0;i<5;i++){
    addLine(
      `[+] Node discovered: ${fakeIPs[i]}  PORT:${Math.floor(Math.random()*8000+1000)}`
    );
    await wait(260);
  }

  addLine("[+] Scan complete.", "green");
}

async function breach(){
  addLine("[*] Establishing encrypted tunnel...");
  await wait(500);
  addLine("[*] Bypassing firewall layer 1...");
  await wait(500);
  addLine("[*] Bypassing firewall layer 2...");
  await wait(500);
  addLine("[!] IDS activity detected.", "warn");
  await wait(650);
  addLine("[+] ACCESS GRANTED", "green");

  document.querySelector(".screen").classList.add("glitch");

  setTimeout(()=>{
    document.querySelector(".screen").classList.remove("glitch");
  },700);
}

async function decrypt(){
  addLine("[*] Loading encrypted block...");
  await wait(300);

  for(let i=0;i<8;i++){
    addLine(
      Math.random().toString(16).substring(2,22).toUpperCase(),
      "dim"
    );
    await wait(90);
  }

  addLine("[+] Decryption complete.", "green");
}

function clearTerminal(){
  history.innerHTML = "";
}

function showHelp(){
  addLine("Available commands:");
  addLine(" help       - show commands");
  addLine(" scan       - simulate network scan");
  addLine(" breach     - simulate access sequence");
  addLine(" decrypt    - simulate decryption");
  addLine(" status     - system status");
  addLine(" whoami     - current user");
  addLine(" clear      - clear terminal");
}

cmd.addEventListener("keydown", async (e)=>{
  if(e.key !== "Enter") return;

  const command = cmd.value.trim().toLowerCase();

  addLine("root@blacknode:~$ " + command);
  cmd.value = "";

  if(command === "help"){
    showHelp();
  }

  else if(command === "scan"){
    await fakeScan();
  }

  else if(command === "breach"){
    await breach();
  }

  else if(command === "decrypt"){
    await decrypt();
  }

  else if(command === "status"){
    addLine("SYSTEM: ONLINE");
    addLine("FIREWALL: ACTIVE");
    addLine("TUNNEL: ENCRYPTED");
    addLine("TRACE STATUS: 0%");
  }

  else if(command === "whoami"){
    addLine("root");
  }

  else if(command === "clear"){
    clearTerminal();
  }

  else if(command === ""){
    return;
  }

  else{
    addLine(`command not found: ${command}`, "error");
  }
});

/* fake live stats */

setInterval(()=>{

  const cpu = Math.floor(Math.random()*75)+10;
  const net = (Math.random()*40).toFixed(1);
  const nodes = Math.floor(Math.random()*8)+2;

  document.getElementById("cpuVal").textContent = cpu+"%";
  document.getElementById("cpuBar").style.width = cpu+"%";

  document.getElementById("netVal").textContent = net+" MB/s";
  document.getElementById("netBar").style.width =
    Math.min(net*2,100)+"%";

  document.getElementById("nodes").textContent = nodes;

},1200);

/* matrix background */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize",resize);

const letters =
  "01ABCDEF$#@<>/\\[]{}SYSTEMROOTACCESSNODE";

const fontSize = 14;
let columns = Math.floor(canvas.width/fontSize);
let drops = Array(columns).fill(1);

function matrix(){

  ctx.fillStyle="rgba(0,4,1,.08)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#00ff66";
  ctx.font=fontSize+"px monospace";

  for(let i=0;i<drops.length;i++){

    const text =
      letters[Math.floor(Math.random()*letters.length)];

    ctx.fillText(
      text,
      i*fontSize,
      drops[i]*fontSize
    );

    if(
      drops[i]*fontSize > canvas.height &&
      Math.random()>.975
    ){
      drops[i]=0;
    }

    drops[i]++;
  }
}

setInterval(matrix,40);
</script>

</body>
</html>
